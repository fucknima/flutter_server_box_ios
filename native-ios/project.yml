name: ServerBox
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.12.1"
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.12.3"
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: "0.3.4"
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: "2.81.0"
targets:
  ServerBox:
    type: application
    platform: iOS
    sources:
      - path: ServerBox
        excludes:
          - Resources
          - "*.entitlements"
      - path: Shared
    resources:
      - path: ServerBox/Resources
        excludes:
          - Info.plist
    dependencies:
      - package: Citadel
      - package: SwiftCrypto
        product: Crypto
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIO
      - target: StatusWidgetExtension
    entitlements:
      path: ServerBox/ServerBox.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.lolli.serverbox.native
        INFOPLIST_FILE: ServerBox/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  StatusWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: StatusWidget
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
    entitlements:
      path: StatusWidget/StatusWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.lolli.serverbox.native.widget
        INFOPLIST_FILE: StatusWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ServerBox Status
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  ServerBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServerBoxTests
    dependencies:
      - target: ServerBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.lolli.serverbox.native.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ServerBox.app/ServerBox"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
